<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light only" />
  <meta name="theme-color" content="#cccccc" />
  <title>UE18 판매 현황</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: light;
      --gutter: 40px;          /* 좌우 여백 */
      --gutter-top: 50px;
      --gutter-bottom: 50px;
      --bg: #cccccc;           /* 작품 소개 사이트와 같은 퓨어 그레이 */
      --fg: #000;
      --fs-title: clamp(36px, min(5vw, 7.5vh), 64px);
      --fs-body: 15px;
      --font: "Noto Sans KR", "Noto Sans SC", system-ui, sans-serif;
    }
    html[lang="zh"] { --font: "Noto Sans SC", "Noto Sans KR", system-ui, sans-serif; }
    *, *::before, *::after { box-sizing: border-box; }
    html, body, * { touch-action: manipulation; } /* 더블탭 확대 막기 */
    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
    }
    button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }

    /* ---------- 언어 버튼 (작품 소개 사이트와 같은 모양) ---------- */
    .lang { position: fixed; top: 10px; right: var(--gutter); z-index: 20; display: flex; gap: 4px; }
    .lang button { width: 30px; height: 30px; padding: 0; border: 1px solid var(--fg); border-radius: 50%; background: transparent; cursor: pointer; }
    .lang svg { display: block; width: calc(100% + 2px); height: calc(100% + 2px); margin: -1px; overflow: visible; }
    .lang text { font-family: var(--font); font-size: 12px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
    .lang__label { fill: currentColor; }
    .lang__fill { fill: currentColor; display: none; }
    .lang button[aria-pressed="true"] .lang__fill { display: inline; }
    .lang button[aria-pressed="true"] .lang__label { display: none; }

    .page {
      min-height: 100vh;
      min-height: 100dvh;
      padding: var(--gutter-top) var(--gutter) var(--gutter-bottom);
      max-width: 960px;
      margin: 0 auto;
    }
    header { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 22px; }
    h1 { margin: 0; font-size: var(--fs-title); font-weight: 700; line-height: 1.1; letter-spacing: -0.02em; }
    .sub { margin: 6px 0 0; font-size: 14px; font-weight: 500; }

    /* ---------- 날짜 탭 ---------- */
    .tabs { display: flex; gap: 6px; margin-bottom: 22px; }
    .tab {
      flex: 1; height: 34px; padding: 0 8px;
      border: 1px solid var(--fg); border-radius: 17px;
      background: transparent; font-size: 14px; font-weight: 500;
      cursor: pointer; white-space: nowrap;
    }
    .tab[aria-selected="true"] { background: var(--fg); color: var(--bg); font-weight: 700; }

    /* 둥근 버튼 (+ / −) */
    .round {
      flex: none;
      display: inline-flex; align-items: center; justify-content: center;
      width: 30px; height: 30px; padding: 0;
      border: 1px solid var(--fg); border-radius: 50%;
      background: transparent;
      font-size: 16px; font-weight: 500; line-height: 1;
      cursor: pointer;
    }
    .round:active { background: var(--fg); color: var(--bg); }
    .round:disabled { opacity: .3; cursor: default; background: transparent; color: var(--fg); }

    /* ---------- 표: 작품 | 가격 | + / − | 수량 | 금액 ---------- */
    .sheet { width: 100%; font-size: var(--fs-body); font-variant-numeric: tabular-nums; }
    .row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 76px 68px 44px 92px;
      align-items: center;
      column-gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--fg);
    }
    .head { font-size: 12px; font-weight: 500; padding: 0 0 8px; border-bottom: 2px solid var(--fg); white-space: nowrap; }
    .work { min-width: 0; }
    .work .title { display: block; font-weight: 500; line-height: 1.35; word-break: keep-all; overflow-wrap: anywhere; }
    .work .author { display: block; font-size: 12px; line-height: 1.4; margin-top: 2px; }
    .num { text-align: right; }
    .btns { display: flex; gap: 6px; justify-content: center; }
    .qty { text-align: center; font-weight: 700; }
    .row.has .sum { font-weight: 700; }
    .row:not(.has) .qty, .row:not(.has) .sum { opacity: .45; }
    /* 총합 탭: 수정 버튼 없이 날짜별 수량을 작게 표시 */
    .days { font-size: 11px; line-height: 1.5; text-align: center; white-space: nowrap; }

    .total {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(44px, max-content) minmax(92px, max-content);
      column-gap: 12px;
      align-items: baseline;
      padding: 16px 0 0;
      border-top: 2px solid var(--fg);
      margin-top: -1px;
      font-size: 22px; font-weight: 700;
      white-space: nowrap;
    }

    /* 휴대폰: 가격은 작가 줄로 */
    @media (max-width: 560px) {
      :root { --gutter: 20px; --gutter-top: 52px; --gutter-bottom: 40px; }
      .row { grid-template-columns: minmax(0, 1fr) 64px 36px 76px; column-gap: 8px; }
      .row .price { display: none; }
      .total { grid-template-columns: minmax(0, 1fr) minmax(36px, max-content) minmax(76px, max-content); column-gap: 8px; font-size: 18px; }
      .tab { font-size: 13px; }
    }
    @media (min-width: 561px) { .work .author .p { display: none; } }

    .toast {
      position: fixed; left: 50%; top: 12px; z-index: 30;
      max-width: calc(100% - 2 * var(--gutter) - 90px);
      height: 30px; padding: 0 14px; border-radius: 15px;
      background: var(--fg); color: var(--bg);
      font-size: 12px; line-height: 30px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      opacity: 0; transform: translate(-50%, -6px); transition: opacity .2s, transform .2s;
      pointer-events: none;
    }
    .toast.on { opacity: 1; transform: translate(-50%, 0); }
  </style>
</head>
<body>
  <nav class="lang" aria-label="Language">
    <button type="button" data-lang="ko" aria-label="한국어">한</button>
    <button type="button" data-lang="zh" aria-label="中文">中</button>
  </nav>

  <main class="page">
    <header>
      <div>
        <h1 data-t="title"></h1>
        <p class="sub">SUNYAO.DESIGN · G22</p>
      </div>
    </header>

    <div class="tabs" role="tablist" id="tabs"></div>

    <div class="sheet" id="sheet">
      <div class="row head">
        <span data-t="work"></span>
        <span class="num price" data-t="price"></span>
        <span class="btns" id="head-btns">+ / −</span>
        <span class="qty" data-t="qty"></span>
        <span class="num" data-t="amount"></span>
      </div>
      <div id="rows"></div>
      <div class="total">
        <span data-t="sum"></span>
        <span class="qty" id="total-qty"></span>
        <span class="num" id="total-sum"></span>
      </div>
    </div>

  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
  (function () {
    "use strict";

    /* 작품 목록: 작품 소개 사이트(SYDesign)와 같은 순서·가격. 가격은 숫자만. */
    const WORKS = [
      { id: "work-1",  price: 48000, ko: ["염증 안내서", "SUN YAO"], zh: ["上火指南", "SUN YAO"] },
      { id: "work-14", price: 10000, ko: ["염증 안내서 – 9종 엽서 세트", "SUN YAO"], zh: ["上火指南 – 9款明信片套装", "SUN YAO"] },
      { id: "work-2",  price: 15000, ko: ["생생불식", "SUN YAO"], zh: ["生生不息", "SUN YAO"] },
      { id: "work-3",  price: 14000, ko: ["새옹지마", "SUN YAO"], zh: ["塞翁失馬", "SUN YAO"] },
      { id: "work-4",  price: 14000, ko: ["금단의 열매", "SUN YAO"], zh: ["禁果", "SUN YAO"] },
      { id: "work-5",  price: 26000, ko: ["낚시하기", "임수현"], zh: ["钓鱼", "林秀炫"] },
      { id: "work-6",  price: 3000,  ko: ["낚시하기 – 스코딕스 엽서", "임수현"], zh: ["钓鱼 – Scodix明信片", "林秀炫"] },
      { id: "work-7",  price: 36000, ko: ["3D 프린팅 타이포그래피", "Li Haoyang"], zh: ["3D打印字体", "Li Haoyang"] },
      { id: "work-8",  price: 22000, ko: ["새옹지마 – 3D", "Li Haoyang"], zh: ["塞翁失馬 – 3D", "Li Haoyang"] },
      { id: "work-9",  price: 14000, ko: ["2D란 무엇이고 3D란 무엇인가", "Li Haoyang"], zh: ["何为二维，何为三维", "Li Haoyang"] },
      { id: "work-10", price: 8000,  ko: ["백독불침", "Li Haoyang"], zh: ["百毒不侵", "Li Haoyang"] },
      { id: "work-11", price: 8000,  ko: ["운수대통", "Li Haoyang"], zh: ["時來運轉", "Li Haoyang"] },
      { id: "work-12", price: 16000, ko: ["The Topography of Typography", "Li Haoyang"], zh: ["The Topography of Typography", "Li Haoyang"] },
      { id: "work-13", price: 30000, ko: ["반전도시", "Li Haoyang"], zh: ["反轉都市", "Li Haoyang"] },
    ];

    /* 날짜 탭 (2026년 북페어) + 총합 */
    const DAYS = [
      { id: "2026-11-06", label: "11/6" },
      { id: "2026-11-07", label: "11/7" },
      { id: "2026-11-08", label: "11/8" },
    ];
    const TOTAL = "total";

    const T = {
      ko: {
        title: "판매 현황", work: "작품 · 작가", price: "가격", qty: "수량", amount: "금액", sum: "합계",
        totalTab: "총합", unit: "개",
        failed: "저장하지 못했습니다. 다시 눌러 주세요", offline: "서버에 연결하지 못했습니다",
      },
      zh: {
        title: "销售情况", work: "作品 · 作者", price: "价格", qty: "数量", amount: "金额", sum: "合计",
        totalTab: "总计", unit: "件",
        failed: "保存失败，请再点一次", offline: "无法连接服务器",
      },
    };

    const KEY = "ue18-sales-v2";
    const won = (n) => n.toLocaleString("ko-KR") + "₩";
    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const rowsEl = document.getElementById("rows");
    const store = (() => { try { return window.localStorage; } catch (e) { return null; } })();
    const get = (k, d) => { try { const v = store && store.getItem(k); return v == null ? d : v; } catch (e) { return d; } };
    const set = (k, v) => { try { store && store.setItem(k, v); } catch (e) {} };

    // sales = { "2026-11-06": { "work-1": 2, ... }, ... }
    // 기준 데이터는 서버(/api/sales)에 저장. 기기에는 화면을 빨리 띄우기 위한 마지막 값만 보관.
    const normalize = (o) => { const r = {}; DAYS.forEach((d) => { r[d.id] = (o && typeof o[d.id] === "object" && o[d.id]) || {}; }); return r; };
    let sales = normalize((() => { try { return JSON.parse(get(KEY, "{}")); } catch (e) { return {}; } })());
    const cache = () => set(KEY, JSON.stringify(sales));
    let pending = 0; // 서버에 보내는 중인 요청 수 (그동안은 서버 값으로 덮어쓰지 않음)

    async function pull() {
      if (pending) return;
      try {
        const r = await fetch("/api/sales", { cache: "no-store" });
        if (!r.ok) throw new Error(r.status);
        const data = await r.json();
        if (pending) return;
        sales = normalize(data); cache(); render();
      } catch (e) { toast(T[lang].offline); }
    }

    async function push(day, id, delta) {
      pending++;
      try {
        const r = await fetch("/api/sales", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ day, id, delta }),
        });
        if (!r.ok) throw new Error(r.status);
        const data = await r.json();
        pending--;
        if (!pending) { sales = normalize(data); cache(); render(); }
        return true;
      } catch (e) {
        pending--;
        // 실패하면 화면의 숫자를 되돌림
        const cur = sales[day][id] || 0, back = Math.max(0, cur - delta);
        if (back) sales[day][id] = back; else delete sales[day][id];
        cache(); render(); toast(T[lang].failed);
        return false;
      }
    }

    let lang = get("ue18-lang", "ko") === "zh" ? "zh" : "ko";
    // 첫 화면: 오늘이 판매일이면 그 날짜, 아니면 마지막으로 보던 탭, 없으면 11/6
    const today = new Date(); const pad = (n) => String(n).padStart(2, "0");
    const todayId = `${today.getFullYear()}-${pad(today.getMonth() + 1)}-${pad(today.getDate())}`;
    let tab = DAYS.some((d) => d.id === todayId) ? todayId : get("ue18-tab", DAYS[0].id);
    if (tab !== TOTAL && !DAYS.some((d) => d.id === tab)) tab = DAYS[0].id;

    const qtyOf = (day, id) => (sales[day] && sales[day][id]) || 0;
    const totalQtyOf = (id) => DAYS.reduce((s, d) => s + qtyOf(d.id, id), 0);
    const viewQty = (id) => (tab === TOTAL ? totalQtyOf(id) : qtyOf(tab, id));
    const tabLabel = (id) => (id === TOTAL ? T[lang].totalTab : DAYS.find((d) => d.id === id).label);

    function renderTabs() {
      const all = [...DAYS.map((d) => d.id), TOTAL];
      document.getElementById("tabs").innerHTML = all.map((id) =>
        `<button type="button" class="tab" role="tab" data-tab="${id}" aria-selected="${id === tab}">${esc(tabLabel(id))}</button>`).join("");
    }

    function render() {
      const L = T[lang];
      const isTotal = tab === TOTAL;
      // 총합 탭 머리글: "11/6·7·8" 처럼 짧게
      document.getElementById("head-btns").textContent = isTotal ? "11/" + DAYS.map((d) => d.label.split("/")[1]).join("·") : "+ / −";
      rowsEl.innerHTML = WORKS.map((w) => {
        const n = viewQty(w.id);
        const [title, author] = w[lang];
        const mid = isTotal
          ? `<span class="btns days">${DAYS.map((d) => qtyOf(d.id, w.id)).join(" · ")}</span>`
          : `<span class="btns">
              <button type="button" class="round" data-d="1" aria-label="+1">+</button>
              <button type="button" class="round" data-d="-1" aria-label="-1"${n ? "" : " disabled"}>−</button>
            </span>`;
        return `<div class="row${n ? " has" : ""}" data-id="${w.id}">
          <span class="work"><span class="title">${esc(title)}</span><span class="author">${esc(author)}<span class="p"> · ${won(w.price)}</span></span></span>
          <span class="num price">${won(w.price)}</span>
          ${mid}
          <span class="qty">${n}</span>
          <span class="num sum">${won(n * w.price)}</span>
        </div>`;
      }).join("");
      const qty = WORKS.reduce((s, w) => s + viewQty(w.id), 0);
      const sum = WORKS.reduce((s, w) => s + viewQty(w.id) * w.price, 0);
      document.getElementById("total-qty").textContent = qty + L.unit;
      document.getElementById("total-sum").textContent = won(sum);
    }

    function setLang(next) {
      lang = next; set("ue18-lang", next);
      document.documentElement.lang = next;
      document.title = "UE18 " + T[next].title;
      document.querySelectorAll(".lang button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === next)));
      document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = T[next][el.dataset.t]; });
      renderTabs(); render();
    }

    // 선택된 언어 버튼은 글자가 뚫린 원 (작품 소개 사이트와 동일)
    document.querySelectorAll(".lang button").forEach((b) => {
      const label = b.textContent.trim(), id = "m-" + b.dataset.lang;
      b.innerHTML = `<svg viewBox="0 0 30 30" aria-hidden="true"><mask id="${id}"><rect width="30" height="30" fill="#fff"/><text x="15" y="15" fill="#000">${label}</text></mask><circle class="lang__fill" cx="15" cy="15" r="15" mask="url(#${id})"/><text class="lang__label" x="15" y="15">${label}</text></svg>`;
    });

    let t;
    function toast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg; el.classList.add("on");
      clearTimeout(t); t = setTimeout(() => el.classList.remove("on"), 1400);
    }

    document.querySelector(".lang").addEventListener("click", (e) => {
      const b = e.target.closest("button[data-lang]"); if (b) setLang(b.dataset.lang);
    });
    document.getElementById("tabs").addEventListener("click", (e) => {
      const b = e.target.closest("[data-tab]"); if (!b) return;
      tab = b.dataset.tab; set("ue18-tab", tab); renderTabs(); render();
    });
    rowsEl.addEventListener("click", (e) => {
      const b = e.target.closest("button[data-d]");
      if (!b || tab === TOTAL) return;
      const id = b.closest(".row").dataset.id;
      const day = sales[tab], delta = Number(b.dataset.d);
      const next = Math.max(0, (day[id] || 0) + delta);
      if (next === (day[id] || 0)) return;
      if (next) day[id] = next; else delete day[id];
      cache(); render();
      const w = WORKS.find((x) => x.id === id);
      toast(`${tabLabel(tab)} · ${w[lang][0]} ${next}${T[lang].unit}`);
      push(tab, id, delta);
    });
    // 다른 기기에서 입력한 수량도 반영되도록 주기적으로 서버 값을 다시 읽음
    setInterval(pull, 15000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) pull(); });

    setLang(lang);
    pull();
  })();
  </script>
</body>
</html>
